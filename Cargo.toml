[package]
name = "xguard-gateway"
version = "2.2.0"
edition = "2024"
rust-version = "1.96"

[dependencies]
axum = "0.8"
base64 = "0.23"
chrono = "0.4"
clap = { version = "4.6", features = ["derive", "env"] }
xguard_certs = { git = "https://github.com/Sajjad-alaa/xguard-core.git", rev = "679512e0ce0cee088f7be489f6cf50a534e2ccf5" }
xguard_grpc_tls = { git = "https://github.com/Sajjad-alaa/xguard-core.git", rev = "679512e0ce0cee088f7be489f6cf50a534e2ccf5" }
xguard_version = { git = "https://github.com/Sajjad-alaa/xguard-core.git", rev = "679512e0ce0cee088f7be489f6cf50a534e2ccf5" }
xguard_wireguard_rs = { git = "https://github.com/Sajjad-alaa/xguard-wireguard-rs.git", rev = "a30f35b3344bb3716f628c96c5f9a9c264813123", version = "0.12" }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-pki-types = "1"
rustls-webpki = { version = "0.103", features = ["ring", "std"] }
env_logger = "0.11"
libc = { version = "0.2", default-features = false }
log = "0.4"
prost = "0.14"
prost-types = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
syslog = "7.0"
thiserror = "2.0"
tokio = { version = "1", features = ["fs", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = [] }
toml = { version = "1.0", default-features = false, features = [
    "parse",
    "serde",
] }
tonic = { version = "0.14", default-features = false, features = [
    "codegen",
    "gzip",
    "router",
    "tls-native-roots",
    "tls-ring",
] }
tonic-prost = "0.14"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = "0.3"


[dev-dependencies]
tokio = { version = "1", features = ["net"] }
tonic = { version = "0.14", default-features = false, features = [
    "codegen",
    "router",
    "transport",
] }
x25519-dalek = { version = "3.0", features = ["getrandom", "static_secrets"] }

[build-dependencies]
tonic-prost-build = "0.14"
vergen-git2 = "10.0"

[profile.release]
codegen-units = 1
panic = "abort"
lto = "thin"
strip = "symbols"
