[start]
command:/usr/local/etc/rc.d/xguard_gateway start
parameters:
type:script
message:starting XGuard Gateway

[stop]
command:/usr/local/etc/rc.d/xguard_gateway stop
parameters:
type:script
message:stopping XGuard Gateway

[restart]
command:/usr/local/etc/rc.d/xguard_gateway restart
parameters:
type:script
message:restarting XGuard Gateway

[status]
command:/usr/local/etc/rc.d/xguard_gateway status
parameters:
type:script
message:request XGuard Gateway status
